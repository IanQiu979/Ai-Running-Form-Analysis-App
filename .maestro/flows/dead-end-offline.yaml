# ============================================================================================
# Dead-end case: connectivity drops mid-flow. Per docs/design/copy-deck.md's "never claim a
# state that isn't true" rule (brief §5), the app must say plainly that nothing was sent and
# offer a Retry — never silently hang, never imply a save/queue that isn't implemented.
#
# REWRITTEN 2026-07-13, same day as the original version, after re-reading lib/connectivity.ts,
# components/offline-banner.tsx, and app/analyzing.tsx directly. The ORIGINAL version of this
# file (see git history) targeted a gate on the SOURCE-PICKER screen (`source-card-upload` ->
# immediate "You're offline" block) that was never real — #93 was filed for exactly that gap and
# it is still true that app/capture/index.tsx has no connectivity check. But #93 has PARTIALLY
# landed since: there IS now a real, live, two-part offline implementation —
#   1. `components/offline-banner.tsx` — a passive, global, non-blocking banner
#      (`Copy.offline.banner`) mounted once in app/_layout.tsx. Confirmed live: it renders
#      nothing while online (no empty shell) and the banner text the moment `useIsOffline()`
#      flips true, from ANY screen, not just capture.
#   2. `lib/connectivity.ts`'s `checkConnectivity()` — a ONE-SHOT pre-flight gate. It is wired
#      into exactly ONE call site today: app/analyzing.tsx's submit effect, which checks
#      connectivity BEFORE calling `analyzeFormClient.submit()`. An offline reading dispatches
#      the machine's `offline` phase, renders `offline.blocked.*` (title "Offline", body
#      literally true here — "nothing has been sent" — because submit() is never called),
#      and offers a live Retry (re-runs the same pre-flight check) and Cancel (returns to Home,
#      clearing the #140 pending-analysis marker). Confirmed by reading app/analyzing.tsx lines
#      ~140-165 and ~399-405 directly — this is real code, not aspirational.
#   3. NOT wired: app/capture/index.tsx (the source picker) has no connectivity check of its own
#      — `checkConnectivity()`'s own header names this as a known, deliberately out-of-scope gap
#      ("both are owned by other in-flight work, so this module only exports the guard"). So a
#      user who goes offline BEFORE tapping into capture gets no warning until they reach
#      Analyzing — capture, extraction, and the "Frames ready" screen all work uninterrupted
#      offline (device-local, no network calls), which is arguably correct per the deck's own
#      "capture itself is not blocked" line, just not signposted with a banner at that stage
#      beyond the passive global one.
#
# This flow now exercises the REAL, reachable gate (#2 above) instead of the imagined one. It
# mints a fresh stranger (same subflow happy-path.yaml uses) rather than requiring a seeded
# account via `--env`, since any signed-up account works for this and there's no reason to make
# the caller supply one.
#
# `setAirplaneMode` is Maestro's mechanism for this on iOS Simulator — verify against the
# installed `maestro -v` version and the actual simulator's behavior before trusting it; the
# Simulator has no real radio, so this exercises whatever NetInfo reports for "no interface,"
# which should still satisfy `isConnectivityUsable`'s `isConnected !== true` branch.
# ============================================================================================

appId: com.ian.paceanalysisai
---
- setAirplaneMode: disabled
- runFlow: subflows/sign-up.yaml

- tapOn: "Start analysis"
- assertVisible: "Add footage"
- tapOn:
    id: "source-card-record"
- runFlow: subflows/grant-consent.yaml
- assertVisible: "Record your run"
- tapOn: "Allow camera access"
- tapOn: "OK" # OS permission dialog — see happy-path.yaml's note on iOS-version wording
- tapOn:
    id: "record-button"
- extendedWaitUntil:
    visible: "2s / 15s"
    timeout: 5000
- tapOn:
    id: "record-button"
- extendedWaitUntil:
    visible: "Frames ready"
    timeout: 20000

# Go offline BEFORE tapping the analyze CTA, so the pre-flight check (which fires the instant
# app/analyzing.tsx's submit effect runs) is guaranteed to see the offline state rather than
# racing it.
- setAirplaneMode: enabled

- tapOn: "Start analysis" # upload.ready.cta -> hands off into /analyzing
- assertVisible: "Analyzing" # analyzing.title renders immediately; the pre-flight check runs
                              # inside the 'waiting' phase, so this is not itself proof of
                              # anything yet — the next assertion is.

# The actual no-dead-end assertion: offline.blocked.* must render, with a live Retry and Cancel,
# NOT a spinner that hangs forever.
- assertVisible: "Offline" # offline.blocked.title
- assertVisible: "This requires an internet connection. Reconnect and try again. Nothing has been sent." # offline.blocked.body
- assertVisible: "Retry" # analyzing.error.cta.retry (shared label, reused for this phase)
- assertVisible: "Cancel" # analyzing.error.cta.cancel

# Prove Retry actually resumes once reconnected — not just dismisses into a second dead end.
- setAirplaneMode: disabled
- tapOn: "Retry"
- assertVisible: "Analyzing"
# Retry re-runs the live pre-flight and deployed analysis request. It must reach the persisted
# result readout, not merely dismiss the offline panel into another dead end.
- extendedWaitUntil:
    visible:
      id: "result-readout-card"
    timeout: 130000
- assertVisible:
    id: "pace-readout"
- setAirplaneMode: disabled

# ============================================================================================
# ALSO WORTH TESTING, NOT DONE HERE: Cancel's own exit (asserting it returns to Home rather than
# Retry) — split into its own run rather than this one so this file can still assert the
# Retry-then-succeed path in one pass; re-running this flow with `tapOn: "Cancel"` substituted
# for the Retry block above is the intended second pass. Also not covered: going offline WHILE
# app/analyzing.tsx is already in `waiting` (mid-request) rather than before it — that's the
# `timedOut`/backgrounding-recovery path (#64), a different mechanism (client-side timeout, not
# this pre-flight gate), and out of this flow's scope.
# ============================================================================================
