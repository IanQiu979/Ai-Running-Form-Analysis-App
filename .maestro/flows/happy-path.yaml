# ============================================================================================
# Issue #86 — the M7 gate: a user can reach Home, receive a persisted live analysis, inspect its
# PACE readout, delete it from History, and sign out with no dead end. The iOS dev-build wrapper
# owns the fresh install and initial launch; this flow owns the user journey only.
#
# RETARGETED to sign-in for issue #203 (2026-09-19): this flow used to open with
# `runFlow: subflows/sign-up.yaml`, minting a fresh stranger each run. Sign-up is currently
# blocked by a real app bug on the EAS development build — GitHub issue #230, evidence in
# docs/evidence/issue-203/signup-cta-unreachable.md — so a fresh-install run can no longer create
# an account through the UI. This flow now signs in to a pre-provisioned fixture account instead
# (see subflows/sign-in.yaml and ../README.md's "Fixture account" section). This is flow drift,
# not a scope change: the M7 gate this flow proves is "an authenticated user has no dead end
# through analysis," and sign-in reaches that same starting state. Re-point this back at
# sign-up.yaml once #230 is fixed and re-verified.
# ============================================================================================

appId: com.ian.paceanalysisai
---
# --- Sign-in (subflow leaves us on Home, authenticated as the fixture account) ------------------
- runFlow: subflows/sign-in.yaml

# --- Home -> source picker ----------------------------------------------------------------------
- tapOn: "Start analysis"
- assertVisible: "Add footage"

# --- Capture via in-app record (chosen over the library-upload path — see README's "Why record,
# not upload" note: no native Photos-picker grid to blindly tap, and `record-button` already
# has a testID). First-ever tap for this account triggers the consent gate before the camera
# permission dance even starts (app/capture/index.tsx's handleCardPress). ---------------------
- tapOn:
    id: "source-card-record"
- runFlow: subflows/grant-consent.yaml

# consent granted -> handleConsented() -> goToRecord() -> pushes /capture/record. FIXED ORDER
# for issue #203 (2026-09-19): app/capture/record.tsx only renders the "Record your run" title
# in its GRANTED-permission branch — the 'undetermined' soft-ask panel (shown here, since every
# harness run resets Simulator privacy via `xcrun simctl privacy reset all`) renders
# "Camera access required" instead, with no "Record your run" text anywhere on screen. The old
# order (assert the title, then tap the soft-ask) never actually passed against this reset-
# privacy harness; it only ever worked when the permission was already granted from a prior run
# on the same install. Soft-ask first, title assertion after, matches the real state machine.
- assertVisible: "Camera access required" # capture.permission.camera.title

# Camera permission soft-ask (first time only). The OS system dialog's exact button text is
# iOS-version-dependent ("Allow"/"OK"/"Don't Allow" have all shipped across iOS releases) —
# verify against the actual simulator's iOS version before trusting this line; see README.
# Confirmed 2026-09-19 on iOS 26.5 / this build: the dialog reads "Allow" / "Don't Allow", not
# "OK" — RE-VERIFY against the actual simulator's iOS version before trusting this line.
- tapOn: "Allow camera access"
- tapOn: "Allow" # <- OS permission dialog. ADJUST to match the simulator's actual iOS version.
- assertVisible: "Record your run"

# Record a short clip. `record-button` (testID, app/capture/record.tsx) toggles start/stop;
# CameraView auto-caps at MAX_CLIP_DURATION_MS (15s) regardless, so 2s here is a deliberately
# short, well-under-cap clip -- long enough that `durationMs > 0` (the guard `handleRecordPress`
# checks before navigating on) is comfortably satisfied.
- tapOn:
    id: "record-button"
- extendedWaitUntil:
    visible: "2s / 15s"
    timeout: 5000
- tapOn:
    id: "record-button"

# --- Extraction ---------------------------------------------------------------------------------
- assertVisible: "Preparing analysis" # upload.title
- assertVisible: "Extracting frames" # upload.step.extracting(current, total) — substring match
- extendedWaitUntil:
    visible: "Frames ready" # upload.ready.title
    timeout: 20000

# --- Hand off to Analyzing (issue #135 — the CTA that used to say "Done" and return to Home now
# reuses home.cta.analyze's exact wording, since from the user's POV this IS starting the
# analysis). Not "Done" anymore — if this line starts failing, check whether the copy changed
# again before assuming the handoff regressed. -----------------------------------------------
- tapOn: "Start analysis" # upload.ready.cta
- assertVisible: "Analyzing" # analyzing.title

# The deployed analysis service persists the completed result before this route resolves.
- extendedWaitUntil:
    visible:
      id: "result-readout-card"
    timeout: 130000

# --- Result -> persisted History row ------------------------------------------------------------
- assertVisible:
    id: "pace-readout"
- tapOn:
    id: "result-done"
- tapOn:
    id: "tab-bar-history"
- extendedWaitUntil:
    visible:
      id: "history-delete-.*"
    timeout: 30000
- tapOn:
    id: "history-delete-.*"
- assertVisible:
    id: "history-delete-confirm"
- tapOn: "Delete analysis"
- extendedWaitUntil:
    visible: "No analyses yet" # history.empty.title
    timeout: 30000

# --- Settings -> sign out -----------------------------------------------------------------------
- tapOn:
    id: "history-settings"
- assertVisible: "Settings"
- tapOn: "Sign out"
- assertVisible:
    id: "settings-dialog" # in-app confirmation dialog; the second tap reaches its primary action.
- tapOn: "Sign out"
- assertVisible:
    id: "entry-hero" # back at the signed-out hero — session cleared, guard swapped
