# ============================================================================================
# Issue #86 — the M7 gate: "a stranger can go sign-up -> analysis -> result with no dead end."
#
# READ ../README.md BEFORE RUNNING THIS. This flow was rewritten 2026-07-13 (same day as the
# rest of this directory) after re-reading the CURRENT screens, because several things the
# original version of this file assumed as blocked have since landed:
#   - #135: app/capture/extracting.tsx's "Frames ready" CTA now reads "Analyze my form"
#     (Copy.upload.ready.cta) and hands off into /analyzing via the
#     setPendingAnalyzeFormRequest() + router.replace('/analyzing') mailbox — confirmed by
#     reading that file directly, not inferred.
#   - #55: (tabs)/history is a real registered tab ("Past Analyses" — Copy.history.title).
#   - #52/#54: app/paywall.tsx exists and Home's quota-exhausted CTA routes to it — not exercised
#     by THIS flow (a fresh stranger never exhausts quota), but recorded here so the next reader
#     doesn't re-discover it from scratch.
#
# Updated 2026-07-25 (issue #92's local Supabase stack + issue #84's first EAS simulator build):
# ran this for real, for the first time, against a `preview-local` build. Confirmed by direct
# read of `app/result/[id].tsx` and `lib/analysis-result.ts`, NOT the original assumption this
# flow shipped with: `app/result/[id].tsx` always does a real `SELECT` on `public.analyses` by
# `id` (issue #92's local stack serves this — no edge function needed), regardless of whether the
# id is UUID-shaped. `lib/analyze-form.ts`'s mock mints a real `Crypto.randomUUID()` id (fixed
# 2026-07-13, see that file's `mockAnalysisId` comment) but never writes an `analyses` row, so the
# `SELECT` always comes back empty and `readAnalysisRow(null)` always resolves to `kind: 'notFound'`
# — the exact same `unavailable` state a bad/deleted id would produce. That is a genuine, useful
# finding for issue #86: even the mock's success path does not produce a dead end (a real Retry
# AND "Back to Home" are both offered, per issue #56's own rule), but it also means this flow, run
# only against the dev mock, CANNOT prove the real `PaceReadout` (pillar scores, hero image,
# disclaimer) ever renders end to end — that needs #44 deployed.
#
# WHAT THIS FLOW PROVES, TODAY, given the dev-mock binding (see lib/analyze-form.ts's header —
# `analyzeFormClient` is hardcoded to `createMockAnalyzeFormClient()`'s zero-arg defaults,
# `outcome: 'success'`, `delayMs: 4000` — #44's real edge function is written but not deployed):
#   sign-up -> consent -> record a clip -> extract frames -> "Frames ready" -> tap "Analyze my
#   form" -> Analyzing (mock waits ~4s) -> Result screen's honest not-found state (no real
#   `analyses` row exists for the mock's id) -> "Back to Home" -> Home -> History tab (EMPTY — the
#   mock never writes an `analyses` row, so this genuinely proves the empty state, not a
#   stubbed-out list) -> Settings -> sign out.
#
# WHAT IT STILL DOES NOT REACH, AND WHY — not a scripting gap, the app genuinely can't get there:
#   - A REAL analysis result: this flow is proving the WIRING (screen-to-screen handoff, no dead
#     end), not that a real Claude call happened or that a real PaceReadout renders. #44 (deploy)
#     + #128 flipping the seam's binding to the real implementation.
#   - History delete: `deleteHistoryAnalysis` (lib/history.ts) calls
#     `DELETE /functions/v1/analysis/:id` (#57) — written+tested but NOT DEPLOYED, and moot here
#     anyway since this flow's mock never creates a row to delete. See dead-end-quota-exhausted's
#     header for the account-seeding gap that would be needed to test delete against a real row.
# ============================================================================================

appId: com.ian.paceanalysisai
---
- launchApp:
    clearState: true

# --- Sign-up (subflow leaves us on Home, freshly authenticated) --------------------------------
- runFlow: subflows/sign-up.yaml

# --- Home -> source picker ----------------------------------------------------------------------
- tapOn: "Analyze my form"
- assertVisible: "Add your run"

# --- Capture via in-app record (chosen over the library-upload path — see README's "Why record,
# not upload" note: no native Photos-picker grid to blindly tap, and `record-button` already
# has a testID). First-ever tap for this account triggers the consent gate before the camera
# permission dance even starts (app/capture/index.tsx's handleCardPress). ---------------------
- tapOn:
    id: "source-card-record"
- runFlow: subflows/grant-consent.yaml

# consent granted -> handleConsented() -> goToRecord() -> pushes /capture/record
- assertVisible: "Record your run"

# Camera permission soft-ask (first time only). The OS system dialog's exact button text is
# iOS-version-dependent ("Allow"/"OK"/"Don't Allow" have all shipped across iOS releases) —
# verify against the actual simulator's iOS version before trusting this line; see README.
- tapOn: "Allow camera access"
- tapOn: "OK" # <- OS permission dialog. ADJUST to match the simulator's actual iOS version.

# Record a short clip. `record-button` (testID, app/capture/record.tsx) toggles start/stop;
# CameraView auto-caps at MAX_CLIP_DURATION_MS (15s) regardless, so 2s here is a deliberately
# short, well-under-cap clip -- long enough that `durationMs > 0` (the guard `handleRecordPress`
# checks before navigating on) is comfortably satisfied.
- tapOn:
    id: "record-button"
- waitForAnimationToEnd:
    timeout: 2000
- tapOn:
    id: "record-button"

# --- Extraction ---------------------------------------------------------------------------------
- assertVisible: "Preparing your analysis" # upload.title
- assertVisible: "Extracting frames" # upload.step.extracting(current, total) — substring match
- extendedWaitUntil:
    visible: "Frames ready" # upload.ready.title
    timeout: 20000

# --- Hand off to Analyzing (issue #135 — the CTA that used to say "Done" and return to Home now
# reuses home.cta.analyze's exact wording, since from the user's POV this IS starting the
# analysis). Not "Done" anymore — if this line starts failing, check whether the copy changed
# again before assuming the handoff regressed. -----------------------------------------------
- tapOn: "Analyze my form" # upload.ready.cta
- assertVisible: "Analyzing" # analyzing.title

# The mock waits ~4s (lib/analyze-form.ts's default delayMs) before resolving 'success'. 15s
# budgets generously past that plus the step-list pacing (~2.55s) and any simulator slowness.
- extendedWaitUntil:
    visible: "Back to Home" # result.cta.done — see the note above on WHY this is what actually
                             # renders, not a real PACE readout.
    timeout: 15000

# --- Result screen — NOT the real readout; see the header note above for why the mock's success
# path lands here (a real UUID id, but no matching `analyses` row to fetch). ---------------------
- assertVisible: "We couldn't find this analysis." # result.error.notFound
- assertVisible: "Retry" # result.error.retry — real, not decorative
- assertVisible: "Back to Home" # result.cta.done
- tapOn: "Back to Home"
- assertVisible: "Analyze my form" # back on Home

# --- History tab (issue #55, now real) — EMPTY is the honest, correct assertion here: the mock
# client never talks to Supabase (lib/analyze-form.ts's header: "nothing here calls the Anthropic
# API, Supabase, or any edge function"), so no `analyses` row was ever created for this account,
# no matter how many times the block above runs in this same launch. ---------------------------
- tapOn: "Past Analyses" # history.title — the tab bar label, matched by text (no `tab-history`
                          # testID exists yet; see ../README.md's HANDOFF)
- assertVisible: "No analyses yet" # history.empty.title
- assertVisible: "Analyze my form" # history.empty.cta — proves History's own empty state isn't
                                    # a dead end either, independent of Home's identical CTA

# --- Settings -> sign out (independently real and reachable — does not depend on an analysis
# existing, so it's exercised here even though no analysis was ever persisted). -----------------
- tapOn: "Settings"
- assertVisible: "Settings"
- tapOn: "Sign out"
- assertVisible: "Sign out?" # native Alert confirm (Settings' confirmSignOut) — Alert is modal,
                              # so the second "Sign out" tap below can only hit the Alert's own
                              # button, not the row that opened it.
- tapOn: "Sign out"
- assertVisible: "Continue with Google" # back at sign-in — session cleared, guard swapped

# ============================================================================================
# STILL NOT COVERED HERE — genuine remaining gaps, not oversights:
#   - Delete-analysis: `history-item-{id}` testID doesn't exist yet (rows are dynamic/list-based;
#     only `history-frame-strip-{id}` / `history-frame-placeholder-{id}` do), and needs a real row
#     — #44/#128 deploy plus #57 deploy.
#   - Compare (Elite-only, #60) — this stranger is never Elite tier.
#   - A cold-relaunch mid-analysis (#140's persisted marker) — needs killing/relaunching the
#     simulator process mid-flow, a different Maestro mechanism (`stopApp` + `launchApp` without
#     `clearState`) not exercised by this pass.
# ============================================================================================
