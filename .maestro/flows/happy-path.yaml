# ============================================================================================
# Issue #86 — the M7 gate: a user can reach Home, receive a persisted live analysis, inspect its
# PACE readout, delete it from History, and sign out with no dead end. The iOS dev-build wrapper
# owns the fresh install and initial launch; this flow owns the user journey only.
#
# RETARGETED to sign-in for issue #203 (2026-09-19): this flow used to open with
# `runFlow: subflows/sign-up.yaml`, minting a fresh stranger each run, until sign-up stopped
# completing on the EAS development build (GitHub issue #230). That was a harness artefact — the
# iOS 26 "Use Strong Password?" panel — and sign-up.yaml was repaired and re-verified on
# 2026-09-20 (docs/evidence/issue-203/signup-cta-unreachable.md). This flow stays on the
# pre-provisioned fixture account by choice (see subflows/sign-in.yaml and ../README.md's
# "Fixture account" section): one account instead of one auth.users row per run, with History
# cleaned by subflows/clear-history.yaml. This is flow drift, not a scope change: the M7 gate
# this flow proves is "an authenticated user has no dead end through analysis," and sign-in
# reaches that same starting state. Swap the first step back to sign-up.yaml if a per-run
# stranger is ever wanted again.
#
# CAPTURE SKIPPED ON THE IOS SIMULATOR (issue #232, 2026-09-20). `scripts/run-maestro-ios-dev-
# build.sh` only ever drives an iOS Simulator (`xcrun simctl`, `MAESTRO_IOS_SIMULATOR_UDID`) —
# there is no real-device variant of this wrapper — and `CameraView.recordAsync` rejects on every
# iOS Simulator with a native `SimulatorNotSupported` error (no camera hardware). This flow used
# to tap into in-app Record at this point and continue through extraction, analysis, and History.
# It no longer does: no fixture clip is checked into this repo (uploaded media is sensitive per
# CLAUDE.md, and `.maestro/README.md`'s prerequisite #3 already explains why the Upload path
# isn't scripted either — it needs a seeded Photos-library asset this repo also doesn't ship), so
# there is no way to produce a clip on a simulator at all. The flow now stops cleanly at the
# capture chooser ("Add footage") with an explicit skip step, instead of failing at
# `record-button` the way it used to. The capture→analyze→History leg this flow used to cover is
# untested on a simulator until a real device (or a locally-provided, gitignored fixture clip
# through Upload) is used instead — see `.maestro/README.md`'s pass/fail matrix.
# ============================================================================================

appId: com.ian.paceanalysisai
---
# --- Sign-in (subflow leaves us on Home, authenticated as the fixture account) ------------------
- runFlow: subflows/sign-in.yaml

# --- Pre-cleanup: delete every analysis the reused fixture account already has ------------------
# The History leg below deletes ONE row and asserts "No analyses yet", which only holds when the
# account has exactly one persisted analysis. A reused account accumulates rows (dead-end-offline
# never deletes its own; any run that fails between analysis and delete leaves one too), so this
# runs unconditionally — it is a no-op with zero rows — and leaves us back on Home.
- runFlow: subflows/clear-history.yaml

# --- Home -> source picker ----------------------------------------------------------------------
- tapOn: "Start analysis"
- assertVisible: "Add footage"

# --- Capture skipped: simulator (issue #232) -----------------------------------------------------
# `CameraView.recordAsync` cannot produce a clip on an iOS Simulator and no fixture clip exists to
# drive the Upload path instead — see this file's header. Nothing is tapped into `source-card-
# record`/`source-card-upload`; the run stops right here, at the capture chooser, rather than
# failing deep inside a native rejection the way it used to.
- evalScript: "${output.captureSkippedReason = 'capture skipped, simulator has no camera, issue 232, no fixture clip checked in'}"

# --- Home -> Settings -> sign out (independent of capture, still exercised here) -----------------
- tapOn: "Back"
- assertVisible: "Start analysis"
- tapOn:
    id: "tab-bar-history"
- tapOn:
    id: "history-settings"
- assertVisible: "Settings"
- tapOn: "Sign out"
- assertVisible:
    id: "settings-dialog" # in-app confirmation dialog; the second tap reaches its primary action.
- tapOn: "Sign out"
- assertVisible:
    id: "entry-hero" # back at the signed-out hero — session cleared, guard swapped
