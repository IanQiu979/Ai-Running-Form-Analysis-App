# ============================================================================================
# Dead-end case: the model call comes back structurally invalid twice (retry-once-then-fail) or
# times out. Copy deck: "This one wasn't counted against your quota — try again" — Retry and
# Cancel must both be live, and Cancel must return to Home, never leave the user stuck on the
# Analyzing screen. app/analyzing.tsx's `analyzingReducer` (lib/analyzing-machine.ts) already
# implements and UNIT-TESTS exactly this (lib/__tests__/analyzing-machine.test.ts covers
# `failed`, `timedOut`, and retry-from-either-state transitions) — what's missing is only the
# END-TO-END trigger and the screen's own rendering of those states, neither of which the unit
# tests touch (screens aren't unit-tested by convention, per CLAUDE.md's Testing section).
#
# UPDATED 2026-07-13, same day as the original — re-verified against current `main`, not just
# copied forward. Part (1) below is FIXED (#135 landed) and this flow's steps use the real
# handoff. Part (2) is STILL BLOCKED: the deployed service has no documented deterministic
# failure-injection contract, which is the one remaining reason this flow cannot be made to pass:
#   1. ~~app/capture/extracting.tsx's "Frames ready" screen never hands off to /analyzing~~ FIXED
#      by #135: the ready-state CTA now reads "Start analysis" and calls
#      `setPendingAnalyzeFormRequest()` + `router.replace('/analyzing')`. See
#      ../flows/happy-path.yaml, which exercises this same handoff for the success case. So this
#      flow's `tapOn: "Done"` below is now WRONG and has been updated to match.
#   2. The deployed `analyze-form` path has no runtime switch, dev menu, or query parameter to
#      force a failed, timed-out, or structurally invalid response. A black-box E2E flow must not
#      manufacture one by changing application source.
#   3. Forcing a structural-validation failure or timeout ON DEMAND from outside the app needs its
#      own designed-in test hook — e.g. a
#      documented magic idempotencyKey prefix, or a staging-only fault-injection flag — that
#      does not exist in docs/architecture.md's API contract today. This is a genuine new
#      requirement, not just a missing testID; see HANDOFF in ../README.md.
#
# NOTE: the sibling flow ../dead-end-offline.yaml DOES reach a live Retry/Cancel error panel
# today (the `offline` phase, a different trigger than this file's `failed`/`timedOut`) — so
# "Retry/Cancel never traps the user" IS partially proven for real, just not via THIS flow's
# specific failure mode. Don't read this file's blocked status as "no error state is provable" —
# see dead-end-offline.yaml.
#
# This flow is written against the copy deck's Screen 6 (Analyzing) so it is ready to run the
# moment (2)-(4) above are addressed, but it cannot be made to pass by writing more Maestro —
# the trigger has to exist first.
# ============================================================================================

appId: com.ian.paceanalysisai
---
# The V23 entry flow (2026-09-20): a cold signed-out launch lands on the hero (app/(auth)/welcome),
# which is the first section of ONE paged scroll — hero, the pillars story (one pillar per
# screen), then the sign-up entry at the end. Nothing is tapped until that entry. The "Scroll down"
# cue is not mounted, and the scroll is locked, until the hero's 3.2 s timeline has held (~4 s) —
# hence the wait on the cue's presence before scrolling, or the swipes land on a locked scroll and
# do nothing. The entry is five paged swipes down; `scrollUntilVisible` pages until it is on
# screen rather than counting them.
- extendedWaitUntil:
    visible:
      id: "entry-hero-cue"
    timeout: 45000
- scrollUntilVisible:
    element:
      id: "entry-sign-up"
    direction: DOWN
    timeout: 45000
- tapOn:
    id: "entry-sign-up"

# The screen opens in sign-up mode; the footer link "Sign in" flips it to sign-in (its submit
# button then also reads "Sign in" — unambiguous each time, since only one is on screen per mode).
- tapOn: "Sign in"
- tapOn: "Email"
- inputText: "${MAESTRO_ANALYSIS_FAILURE_TEST_EMAIL}"
- tapOn: "Password"
- inputText: "${MAESTRO_ANALYSIS_FAILURE_TEST_PASSWORD}"
- tapOn: "Sign in"
- assertVisible: "Start analysis"

- tapOn: "Start analysis"
- tapOn:
    id: "source-card-record"
- runFlow: subflows/grant-consent.yaml
- tapOn: "Allow camera access"
- tapOn: "Allow" # OS permission dialog (confirmed "Allow"/"Don't Allow" 2026-09-19) — see happy-path.yaml
- tapOn:
    id: "record-button"
- waitForAnimationToEnd:
    timeout: 2000
- tapOn:
    id: "record-button"
- extendedWaitUntil:
    visible: "Frames ready"
    timeout: 20000

# --- The handoff itself is real now (#135) — this line runs fine. Everything AFTER it still
# needs the fix described in the header comment (#2: no way to force a non-success outcome). ---

- tapOn: "Start analysis" # upload.ready.cta — the real handoff, matches happy-path.yaml
# TODO: some documented, deterministic way to force a failure/timeout outcome for THIS
# analysis. Nothing in the current app takes such a signal — without it, the two assertions below
# will fail loudly and correctly because a normal live request resolves to a result instead of
# showing "Analysis failed".

- assertVisible: "Analyzing" # analyzing.title
- extendedWaitUntil:
    visible: "Analysis failed" # analyzing.error.failed.title
    timeout: 30000
- assertVisible: "The analysis service did not return a usable result. This attempt was not counted against your quota. Try again." # analyzing.error.failed.body — the specific quota-honesty clause issue #86 calls out by name

# Retry must be live, not decorative.
- tapOn: "Retry" # analyzing.error.cta.retry
- assertVisible: "Analyzing"

# Force the SAME failure again (whatever mechanism landed above) so Cancel can be proven too.
- extendedWaitUntil:
    visible: "Analysis failed"
    timeout: 30000
- tapOn: "Cancel" # analyzing.error.cta.cancel — "Retry/Cancel must never trap the user"
- assertVisible: "Start analysis" # back on Home, not stuck on Analyzing
