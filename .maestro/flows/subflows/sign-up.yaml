# Subflow — signs up a brand-new "stranger" via email/password and lands on Home.
#
# Not a standalone test (excluded from ../../config.yaml's `flows/*.yaml` glob). The caller is
# expected to have already run `launchApp: { clearState: true }` — a real stranger has no
# existing session, and this subflow doesn't force that itself so it can also be reused later
# for a repeat-signup negative test without double-clearing app state.
#
# Sets ${output.e2eEmail} / ${output.e2ePassword} so the caller can assert against the same
# account afterward (e.g. signing back in, or a future delete-account flow).
#
# Google/Apple sign-in are NOT scripted here — they need a real, credentialed browser OAuth
# round-trip (Google) or an Apple Developer account that doesn't exist yet (blocked-on-apple.md).
# Email/password is the only path a fully scripted "stranger" can take end to end.
#
# The installed Maestro CLI (1.39.0) requires every file it loads — including a runFlow:
# subflow — to declare appId, even though it's inert here (the caller's launchApp already set the
# target app). Added below 2026-07-25 after the first real execution attempt failed to parse
# without it; contrary to this comment block's original assumption, "not a standalone test" does
# not exempt a file from this version's parser.
appId: com.ian.paceanalysisai
---
- evalScript: ${output.e2eEmail = 'maestro.e2e+' + Date.now() + '@example.com'}
- evalScript: ${output.e2ePassword = 'Pace-e2e-' + Date.now() + '!Aa'}

# extendedWaitUntil, not a bare assertVisible: a cold app launch (right after launchApp's
# clearState) takes noticeably longer to reach the first screen than a warm one, and Maestro's
# own iOS driver can take 15-20s just to finish connecting on a loaded host before it can query
# anything at all. 45s gives real headroom for both — but see ../../README.md's 2026-07-25 update
# before assuming a longer timeout alone fixes a failure here: this exact assertion has also
# failed with 45s of budget while Maestro's own failure screenshot showed the correct screen and
# maestro.log showed a STABLE, unchanging view-hierarchy poll the whole time. That is the iOS
# accessibility-tree bridge itself intermittently failing to resolve, not something a bigger
# number fixes — if you hit this, it's the driver, not this flow or the app under test.
#
# The V23 entry flow (2026-09-14): a cold signed-out launch lands on the hero (app/(auth)/welcome),
# whose "Continue" cue only becomes tappable once the hero's 3.2 s timeline has held (~4 s) —
# hence `enabled: true`, not a bare visibility wait, or the tap lands on a disabled control and
# is swallowed. Then the details page and its own "Continue" to the sign-up/sign-in screen.
- extendedWaitUntil:
    visible:
      id: "entry-hero-cue"
      enabled: true
    timeout: 45000
- tapOn:
    id: "entry-hero-cue"
- tapOn:
    id: "details-continue"

# The screen opens in sign-up mode (V23-06's first artboard) — no mode toggle needed; the footer
# reads "Already have an account? Sign in" and is left alone.
- assertVisible: "Create account"

# No testID on these two TextInputs today — matched by their placeholder text, which doubles as
# their accessibilityLabel (app/(auth)/sign-in.tsx). See the HANDOFF block in ../../README.md:
# `auth-email-input` / `auth-password-input` testIDs would make this more robust than a text
# match, but aren't required for this to work.
- tapOn: "Email"
- inputText: "${output.e2eEmail}"
- tapOn: "Password"
- inputText: "${output.e2ePassword}"

# The 16+ / Terms consent checkbox (app/(auth)/sign-in.tsx). "Create account" stays disabled
# until it is ticked, alongside the captcha token.
- tapOn:
    id: "signup-consent"
- tapOn: "Create account"

# Supabase email confirmation is disabled for this MVP (supabase/config.toml) — the session
# should exist immediately, and app/_layout.tsx's Stack.Protected should swap straight from
# (auth) to (tabs). If this hangs, the most likely cause is `auth.error.generic` rendering
# instead (see sign-in.tsx's signUp branch) — check for that text before assuming a Maestro bug.
- assertVisible: "Start analysis"
