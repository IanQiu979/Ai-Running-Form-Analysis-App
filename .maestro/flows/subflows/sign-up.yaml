# Subflow — signs up a brand-new "stranger" via email/password and lands on Home.
#
# REPAIRED 2026-09-20 — GitHub issue #230 was a test-harness artefact, not an app defect. The
# "unpainted" Create account button was sitting under iOS 26's "Use Strong Password?" panel
# (415 pt, the keyboard window), which XCTest screenshots — the ones Maestro takes — do not
# render, while Maestro judges visibility by window bounds and so never scrolled. The same panel
# swallows every typed character after the first. Both are handled below, at the password
# field; nothing in app/(auth)/sign-in.tsx changed. Evidence and the full diagnosis:
# docs/evidence/issue-203/signup-cta-unreachable.md. Verified live on the EAS development build
# (dbd22da6, iPhone 17 / iOS 26.5 simulator) on 2026-09-20: a fresh stranger reaches Home.
#
# happy-path.yaml / dead-end-offline.yaml still sign in to the fixture account via
# subflows/sign-in.yaml by choice (one account, History cleaned per run, no auth.users growth) —
# this subflow is the stranger path, for a sign-up leg of its own.
#
# Not a standalone test (excluded from ../../config.yaml's `flows/*.yaml` glob). The caller is
# expected to have been freshly installed and launched by the iOS dev-build wrapper — a real
# stranger has no existing session, and this subflow doesn't force that itself so it can also be
# reused later for a repeat-signup negative test without double-clearing app state.
#
# Sets ${output.e2eEmail} / ${output.e2ePassword} so the caller can assert against the same
# account afterward (e.g. signing back in, or a future delete-account flow).
#
# Google/Apple sign-in are NOT scripted here — they need a real, credentialed browser OAuth
# round-trip (Google) or an Apple Developer account that doesn't exist yet (blocked-on-apple.md).
# Email/password is the only path a fully scripted "stranger" can take end to end.
#
# The installed Maestro CLI (1.39.0) requires every file it loads — including a runFlow:
# subflow — to declare appId, even though it is inert here (the wrapper already set the target
# app). Added below 2026-07-25 after the first real execution attempt failed to parse
# without it; contrary to this comment block's original assumption, "not a standalone test" does
# not exempt a file from this version's parser.
appId: com.ian.paceanalysisai
---
- evalScript: ${output.e2eEmail = 'maestro.e2e+' + Date.now() + '@example.com'}
- evalScript: ${output.e2ePassword = 'Pace-e2e-' + Date.now() + '!Aa'}

# extendedWaitUntil, not a bare assertVisible: a fresh wrapper-owned app launch takes noticeably
# longer to reach the first screen than a warm one, and Maestro's
# own iOS driver can take 15-20s just to finish connecting on a loaded host before it can query
# anything at all. 45s gives real headroom for both — but see ../../README.md's 2026-07-25 update
# before assuming a longer timeout alone fixes a failure here: this exact assertion has also
# failed with 45s of budget while Maestro's own failure screenshot showed the correct screen and
# maestro.log showed a STABLE, unchanging view-hierarchy poll the whole time. That is the iOS
# accessibility-tree bridge itself intermittently failing to resolve, not something a bigger
# number fixes — if you hit this, it's the driver, not this flow or the app under test.
#
# The V23 entry flow (2026-09-20): a cold signed-out launch lands on the hero (app/(auth)/welcome),
# which is the first section of ONE paged scroll — hero, the pillars story (one pillar per
# screen), then the sign-up entry at the end. Nothing is tapped until that entry. The "Scroll down"
# cue is not mounted, and the scroll is locked, until the hero's 3.2 s timeline has held (~4 s) —
# hence the wait on the cue's presence before scrolling, or the swipes land on a locked scroll and
# do nothing. The entry is five paged swipes down; `scrollUntilVisible` pages until it is on
# screen rather than counting them.
- extendedWaitUntil:
    visible:
      id: "entry-hero-cue"
    timeout: 45000
- scrollUntilVisible:
    element:
      id: "entry-sign-up"
    direction: DOWN
    timeout: 45000
- tapOn:
    id: "entry-sign-up"

# The screen opens in sign-up mode (V23-06's first artboard) — no mode toggle needed; the footer
# reads "Already have an account? Sign in" and is left alone.
- assertVisible: "Get started"

# No testID on these two TextInputs today — matched by their placeholder text, which doubles as
# their accessibilityLabel (app/(auth)/sign-in.tsx). See the HANDOFF block in ../../README.md:
# `auth-email-input` / `auth-password-input` testIDs would make this more robust than a text
# match, but aren't required for this to work.
- tapOn: "Email"
- inputText: "${output.e2eEmail}"
- tapOn: "Password"

# Focusing the EMPTY `newPassword` field makes iOS 26 present its "Use Strong Password?" panel in
# place of the keyboard: 415 pt tall against the keyboard's 308 pt, opaque to the accessibility
# tree (no labels, so no selector can name it), invisible in Maestro's XCTest screenshots, and it
# swallows every typed character after the first — `inputText` leaves the field holding one
# bullet and a later submit fails "Password must be at least 8 characters". Its close X does
# accept an XCTest tap (unlike the synthetic clicks docs/status.md Known Issue #38 tried), so
# dismiss it BEFORE typing. Detection is by proxy: the keyboard's own return key (`Go`, from the
# field's returnKeyType) is in the tree only when the real keyboard is up. The X's location is
# iPhone 17 geometry (the panel occupies y 459–874 of 874, its X centred near x 363, y 508 pt) —
# a different simulator model needs this point re-measured with `maestro hierarchy`. Guarded so a
# simulator with "Suggest Strong Passwords" already off never taps into the form.
- waitForAnimationToEnd:
    timeout: 3000
- runFlow:
    when:
      notVisible:
        id: "Go"
    commands:
      - tapOn:
          point: "90%,58%"
      - extendedWaitUntil:
          visible:
            id: "Go"
          timeout: 10000
- inputText: "${output.e2ePassword}"

# Drop the keyboard before touching anything else. With `keyboardShouldPersistTaps="handled"` the
# consent checkbox and the widget leave it up, and a keyboard-shrunk viewport is exactly what put
# the CTA out of reach under the panel. A tap on the title — plain Text, not a responder — hands
# the touch to the ScrollView, which blurs the field; the form then re-centres with every control
# visible on an iPhone 17. Reproduced 2026-09-20: the same tap on a gap in the form cleared the
# keyboard window and put "Create account" back on screen.
- tapOn: "Get started"

# The age choice (2026-09-20) and the Terms consent checkbox both gate account creation. The
# stranger is an adult: "18 or older" needs no attestation (the 13–17 option would reveal the
# guardian checkbox, `signup-age-guardian-consent`, which a minor path would also have to tick).
# Cloudflare can either present its visible challenge or auto-resolve, so tap the challenge only
# when it is actually present. The widget is a fixed 70 pt box in both states
# (components/turnstile-widget.tsx) — "Success!" does not grow the form.
- tapOn:
    id: "signup-age-18-plus"
- tapOn:
    id: "signup-consent"
- tapOn:
    id: "signup-future-uploads-consent"
- runFlow:
    when:
      visible: "Verify you are human"
    commands:
      - tapOn: "Verify you are human"
- extendedWaitUntil:
    visible: "Success!"
    timeout: 45000
# The form (header, two fields, the age choice, consent, widget, two buttons, footer) is taller
# than it was before the age choice landed and may no longer fit an iPhone 17 with the keyboard
# down; the ScrollView scrolls and this reaches the CTA either way. There is deliberately no
# blind background swipe here any more: the old `swipe` from 88% landed on the keyboard window
# whenever one was up, and did nothing.
- scrollUntilVisible:
    element:
      id: "auth-email-submit"
    direction: DOWN
    timeout: 45000
- extendedWaitUntil:
    visible:
      id: "auth-email-submit"
      enabled: true
    timeout: 45000
- takeScreenshot: "node_modules/.cache/maestro-ios-dev/auth-email-submit-ready"
- tapOn:
    id: "auth-email-submit"

# iOS's Keychain "Save Password?" sheet can follow a real credential submission (it does on
# sign-in — see subflows/sign-in.yaml); dismiss it if it appears so it cannot sit over Home.
- runFlow:
    when:
      visible: "Save Password?"
    commands:
      - tapOn: "Not Now"

# Supabase email confirmation is disabled for this MVP (supabase/config.toml) — the session
# should exist immediately, and app/_layout.tsx's Stack.Protected should swap straight from
# (auth) to (tabs). If this hangs, the most likely cause is `auth.error.generic` rendering
# instead (see sign-in.tsx's signUp branch) — check for that text before assuming a Maestro bug.
- assertVisible: "Start analysis"
