# Subflow — the consent gate (components/consent-gate.tsx), first time only.
#
# REWRITTEN 2026-07-13, same day as the rest of this directory. The ORIGINAL version of this
# file (see git history) only handled issue #68's single health-consent checkbox, which was the
# whole gate at the time it was written. It is NOT anymore: issue #94 landed a SECOND, always-
# required checkbox on that same first screen (age confirmation) AND a wholly separate SECOND
# PHASE ("who's in this photo or video?") that runs on every gate presentation, not just the
# first. The original subflow ticked one checkbox, tapped the primary CTA once, then asserted
# the gate was gone — which would have FAILED loudly (button silently disabled by the unticked
# age checkbox, gate still mounted afterward) the moment it was ever actually run. Caught by
# re-reading components/consent-gate.tsx directly against this subflow before trusting it, per
# this run's own instruction to re-verify selectors against current screens.
#
# Not a standalone test. Assumes the caller just tapped either source-picker card
# (app/capture/index.tsx's `source-card-upload` / `source-card-record`) that triggers this gate,
# so `ConsentGate` is currently mounted in place of the source-picker cards (handleCardPress ->
# pendingAction set -> the gate renders, replacing the cards entirely).
#
# Every testID used here already exists on `main` (components/consent-gate.tsx) — this is
# the one leg of the whole capture flow that needs no new testIDs at all.
#
# The installed Maestro CLI (1.39.0) requires every file it loads — including a runFlow:
# subflow — to declare appId, even though it's inert here. See sign-up.yaml's identical note,
# added 2026-07-25 after the first real execution attempt.
appId: com.ian.paceanalysisai
---
# --- Phase 1 ('health'): two once-ever checkboxes, both required, gated by an append-only
# `public.consents` row keyed to the signed-in account (lib/consent.ts) — NOT by local app state.
# A fresh install (this repo's per-flow wrapper uninstalls+reinstalls every run) does not reset
# it for a REUSED account, so phase 1 only renders on that account's genuine first grant.
# Retargeted for issue #203 (2026-09-19): flows now sign in to a persistent fixture account
# (see subflows/sign-in.yaml) instead of minting a fresh stranger per run, so this phase is
# conditional from here on — `runFlow: when:` mirrors the existing Turnstile pattern in
# sign-up.yaml. -------------------------------------------------------------------------------
- runFlow:
    when:
      visible: "Before you upload" # consent.upload.title
    commands:
      - assertVisible: "I consent to my images being analyzed to produce health-related feedback, and to Anthropic processing them to do so." # consent.upload.checkbox
      - tapOn:
          id: "consent-checkbox"
      - tapOn:
          id: "consent-age-checkbox" # consent.upload.age.checkbox — "I confirm I am 16 or older."
                                      # (issue #94) — the primary CTA stays disabled without this
                                      # one too; omitting it is exactly the bug this rewrite fixes.
      - tapOn:
          id: "consent-cta-primary" # consent.upload.cta.primary — advances to phase 'subject',
                                     # does NOT call onConsented() yet (see module docblock:
                                     # phase 'subject' runs on every presentation, no short-circuit).

# --- Phase 2 ('subject'): always shown, every presentation, no once-ever shortcut. Picking
# "This is me" is the simplest path a self-filming stranger takes and needs no extra checkbox
# (that's only for "Someone else" -> consent-subject-checkbox) --------------------------------
#
# Asserted by testID, not text: observed 2026-09-19 failing repeatedly (even with a 20s
# extendedWaitUntil) on a REUSED account landing here immediately after phase 1 was skipped,
# while every one of those failures' own screenshots showed this exact text rendered correctly —
# the same iOS accessibility-tree bridge flakiness ../../README.md's 2026-07-25 update already
# documents for `entry-hero-cue` (a longer timeout did not fix it there either). Waiting on
# `consent-subject-option-me`'s id instead of the "Who is in this photo or video?" text reached
# the same screen state reliably, so the flakiness is specific to resolving THIS TEXT node, not
# the screen transition itself.
- extendedWaitUntil:
    visible:
      id: "consent-subject-option-me"
    timeout: 20000
- tapOn:
    id: "consent-subject-option-me" # consent.upload.subject.option.me — "This is me"
- tapOn:
    id: "consent-cta-primary" # label is "Continue" for subject 'me' (consent.upload.subject.cta.primary('me'))

# grantConsent() paths complete (or, for 'me', nothing new to grant — see handleSubjectSubmit)
# -> onConsented() -> the host (app/capture/index.tsx) unmounts this gate and proceeds into
# whichever card was originally tapped. Proving THAT happened is the caller's job (it knows
# which action it started), not this subflow's.
- assertNotVisible: "Before you upload"
- assertNotVisible: "Who is in this photo or video?"
